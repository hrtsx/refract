id = "refract"
name = "Refract Ruby LSP"
version = "0.1.0"
schema_version = 1
authors = ["refract contributors"]
description = "Ruby language server backed by Refract"
repository = "https://github.com/hrtsx/refract"

[language_servers.refract]
name = "refract"
languages = ["Ruby", "Embedded Ruby"]

[language_servers.refract.binary]
arguments = ["--stdio"]

[debug_adapters.refract]
name = "Refract (rdbg)"
languages = ["Ruby"]

[debug_adapters.refract.binary]
arguments = ["--dap"]
