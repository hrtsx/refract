on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lsp-protocol-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: LSP initialize handshake smoke
        run: |
          mkdir -p /tmp/smoke-ws
          cat > /tmp/smoke-ws/sample.rb <<'RB'
          class Smoke
            def hello(name); puts name; end
          end
          RB
          cat > /tmp/init.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":"file:///tmp/smoke-ws","capabilities":{},"initializationOptions":{"disableGemIndex":true,"disableRubocop":true}}}
          JSON
          LEN=$(wc -c < /tmp/init.json)
          { printf "Content-Length: %d\r\n\r\n" "$LEN"; cat /tmp/init.json; } | timeout 10 ./zig-out/bin/refract --db-path /tmp/smoke.db > /tmp/smoke.out 2>/tmp/smoke.err
          if grep -q '"capabilities"' /tmp/smoke.out; then
            echo "LSP initialize handshake OK"
          else
            echo "FAIL: no capabilities in response"
            echo "--- stdout ---"; cat /tmp/smoke.out
            echo "--- stderr ---"; cat /tmp/smoke.err
            exit 1
          fi

  emacs-eglot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Emacs eglot smoke
        run: |
          mkdir -p /tmp/emacs-ws
          cat > /tmp/emacs-ws/sample.rb <<'RB'
          class Smoke
            def hello; "ok"; end
          end
          RB
          sudo cp ./zig-out/bin/refract /usr/local/bin/refract
          /usr/local/bin/refract --version
          # Pre-warm stdlib RBS so first eglot connect doesn't time out indexing.
          /usr/local/bin/refract --warm-stdlib --db-path /tmp/refract-emacs.db
          emacs --batch --eval "
          (progn
            (require 'eglot)
            (setq eglot-events-buffer-size 0
                  eglot-connect-timeout 90
                  eglot-sync-connect 90)
            (add-to-list 'eglot-server-programs '(ruby-mode . (\"refract\" \"--db-path\" \"/tmp/refract-emacs.db\")))
            (setq default-directory \"/tmp/emacs-ws/\")
            (find-file \"/tmp/emacs-ws/sample.rb\")
            (ruby-mode)
            (condition-case err
                (eglot 'ruby-mode
                       (cons 'transient default-directory)
                       'eglot-lsp-server
                       '(\"refract\" \"--db-path\" \"/tmp/refract-emacs.db\")
                       \"ruby\")
              (error (message \"eglot connect error: %S\" err)))
            (let ((deadline (+ (float-time) 90)))
              (while (and (not (eglot-current-server)) (< (float-time) deadline))
                (accept-process-output nil 0.5)))
            (if (eglot-current-server)
                (progn (message \"eglot OK\") (kill-emacs 0))
              (progn (message \"eglot FAIL — no server attached after 90s\") (kill-emacs 1))))"

  helix-config-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: Install Helix
        run: |
          curl -sL https://github.com/helix-editor/helix/releases/download/24.07/helix-24.07-x86_64-linux.tar.xz -o helix.tar.xz
          tar -xJf helix.tar.xz
          sudo cp helix-24.07-x86_64-linux/hx /usr/local/bin/hx
          sudo cp ./zig-out/bin/refract /usr/local/bin/refract
      - name: Helix config + health check
        run: |
          mkdir -p ~/.config/helix
          cat > ~/.config/helix/languages.toml <<'TOML'
          [language-server.refract]
          command = "refract"

          [[language]]
          name = "ruby"
          language-servers = ["refract"]
          TOML
          hx --health ruby > /tmp/helix-health.out 2>&1 || true
          cat /tmp/helix-health.out
          if grep -q "Configured language servers:" /tmp/helix-health.out && grep -q "refract" /tmp/helix-health.out; then
            echo "Helix LSP config OK"
          else
            echo "FAIL: Helix did not pick up refract config"
            exit 1
          fi

  config-only-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [zed, sublime-lsp, jetbrains, kate]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq libxml2-utils python3
      - name: Run ${{ matrix.editor }} smoke
        env:
          REFRACT_BIN: ${{ github.workspace }}/zig-out/bin/refract
        run: bash editors/${{ matrix.editor }}/smoke.sh

  neovim-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: Install Neovim (>=0.10 AppImage for vim.lsp.get_clients)
        run: |
          curl -sL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.appimage -o /tmp/nvim.appimage
          chmod +x /tmp/nvim.appimage
          (cd /tmp && ./nvim.appimage --appimage-extract >/dev/null)
          sudo ln -sf /tmp/squashfs-root/usr/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1
      - name: Neovim LSP smoke
        env:
          REFRACT_BIN: ${{ github.workspace }}/zig-out/bin/refract
        run: |
          sudo cp ./zig-out/bin/refract /usr/local/bin/refract
          /usr/local/bin/refract --version
          /usr/local/bin/refract --warm-stdlib --db-path /tmp/refract-nvim.db
          mkdir -p /tmp/nvim-ws
          echo 'class Smoke; def hello; "ok"; end; end' > /tmp/nvim-ws/sample.rb
          # Use built-in vim.lsp.start (no nvim-lspconfig plugin dep) so the smoke
          # works on a vanilla Neovim install. The shipped editors/neovim/init.lua
          # uses lspconfig — that path is verified by end users with a plugin
          # manager, not in CI.
          cat > /tmp/nvim-smoke.lua <<'LUA'
          -- nvim --headless -u NONE disables filetype detection AND skips
          -- FileType autocmds for the file opened on the cmdline. Start the
          -- LSP client directly against the already-loaded buffer.
          local bufnr = vim.api.nvim_get_current_buf()
          vim.bo[bufnr].filetype = "ruby"
          local ok, err = pcall(vim.lsp.start, {
            name = "refract",
            cmd = { "refract", "--db-path", "/tmp/refract-nvim.db" },
            root_dir = "/tmp/nvim-ws",
            bufnr = bufnr,
          })
          io.stderr:write("vim.lsp.start ok=" .. tostring(ok) .. " err=" .. tostring(err) .. "\n")
          vim.defer_fn(function()
            local clients = (vim.lsp.get_clients or vim.lsp.get_active_clients)()
            if #clients < 1 then
              io.stderr:write("FAIL: no LSP client active after 25s\n")
              vim.cmd("cq")
            else
              io.stdout:write("Neovim LSP smoke OK (" .. #clients .. " client)\n")
              vim.cmd("qa")
            end
          end, 25000)
          LUA
          nvim --headless -u NONE -c "luafile /tmp/nvim-smoke.lua" /tmp/nvim-ws/sample.rb -c 'sleep 30' \
            || { echo "FAIL: Neovim LSP client did not start"; exit 1; }

  vscode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VSCode extension smoke
        env:
          REFRACT_BIN: ${{ github.workspace }}/zig-out/bin/refract
        run: |
          sudo cp ./zig-out/bin/refract /usr/local/bin/refract
          sudo apt-get update && sudo apt-get install -y xvfb
          cd editors/vscode
          npm install
          xvfb-run -a npm test
