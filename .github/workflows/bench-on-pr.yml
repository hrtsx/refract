name: Bench on PR

on:
  pull_request:
    paths:
      - "src/**"
      - "build.zig"
      - "scripts/bench/**"
      - ".github/workflows/bench-on-pr.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench head vs main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Setup Zig 0.16
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Setup Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Cache benchmark workspaces
        uses: actions/cache@v4
        with:
          path: |
            corpora/mastodon
            corpora/discourse
          key: bench-corpora-v1
          restore-keys: bench-corpora-

      - name: Build head + base
        run: |
          (cd head && zig build -Doptimize=ReleaseSafe)
          (cd base && zig build -Doptimize=ReleaseSafe)

      - name: Generate synthetic corpus (10k for PR speed)
        run: |
          ./head/scripts/bench/synth_corpus.rb corpora/synth-10k 10000

      - name: Run head bench
        env:
          REFRACT_BIN: head/zig-out/bin/refract
        run: |
          (cd head && scripts/bench/realistic_run.sh) || true
          mv head/bench-results/realistic head_results

      - name: Run base bench
        env:
          REFRACT_BIN: base/zig-out/bin/refract
        run: |
          (cd base && scripts/bench/realistic_run.sh) || true
          mv base/bench-results/realistic base_results

      - name: Compute regression delta
        id: delta
        run: |
          python3 head/scripts/bench/compare.py head_results base_results > delta.txt
          cat delta.txt
          # Gates:
          # - any session-mode op p95 regresses > 15% → PR red
          # - any micro/hover/p50 or micro/def/p50 regresses > 10% → PR red
          status=0
          if grep -E "REGRESSION p95 [0-9]+\.[0-9]+%$" delta.txt | awk -F' ' '{ if ($3+0 > 15) exit 1 }'; then
            :
          else
            echo "session p95 regression > 15% detected"
            status=1
          fi
          if grep -E "MICRO (hover|def)/p50 REGRESSION [0-9]+\.[0-9]+%$" delta.txt | awk -F' ' '{ if ($4+0 > 10) exit 1 }'; then
            :
          else
            echo "micro hover/def p50 regression > 10% detected"
            status=1
          fi
          exit $status

      - name: Enforce absolute perf floor (beat ruby-lsp by 25%)
        run: |
          python3 - <<'PY'
          import json, os, sys, glob
          # Thresholds: beat ruby-lsp (0.20/0.20/1.18 ms p50) by 25%.
          BARS = {"hover": 0.20, "def": 0.15, "comp": 0.90}
          fails = []
          for path in glob.glob("head_results/**/*.json", recursive=True):
              try:
                  data = json.loads(open(path).read())
              except Exception:
                  continue
              # realistic_run.sh emits {"corpus": "...", "micro": {"refract": {"hover": {"p50_ms": …}, ...}}}
              micro = (data.get("micro") or {}).get("refract") or {}
              for op, bar in BARS.items():
                  p50 = (micro.get(op) or {}).get("p50_ms")
                  if p50 is None:
                      continue
                  if p50 > bar:
                      fails.append(f"{os.path.basename(path)}: micro/{op}/p50={p50:.2f}ms > {bar}ms bar")
          if fails:
              print("PERF FLOOR FAIL:")
              for f in fails: print(" ", f)
              sys.exit(1)
          print("perf floor OK (all micro p50s within 25% of ruby-lsp gap)")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            head_results/
            base_results/
          retention-days: 90

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body = "Bench delta unavailable.";
            try { body = "```\n" + fs.readFileSync("delta.txt", "utf8") + "\n```"; } catch {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
