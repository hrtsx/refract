name: Nightly soak

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: 24h soak (single-shot)
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    env:
      REFRACT: zig-out/bin/refract
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Build refract
        run: zig build -Doptimize=ReleaseSafe

      - name: Generate 10k synthetic corpus
        run: ./scripts/bench/synth_corpus.rb /tmp/soak-corpus 10000

      - name: Run soak (8 h cap on CI)
        run: ./scripts/soak.sh /tmp/soak-corpus 28800

      - name: Upload crash logs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-crash-logs
          path: |
            ~/.local/state/refract/crash-*.log
            /tmp/refract-soak-*/refract.stderr
          if-no-files-found: ignore
