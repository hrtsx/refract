name: Soak Nightly

on:
  schedule:
    - cron: "37 5 * * *"           # nightly @ 05:37 UTC: 2 h broad-corpus
    - cron: "0 4 * * 0"             # weekly Sunday @ 04:00 UTC: 5 h deep
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Soak duration (default 7200 = 2 h; weekly cron uses 18000 = 5 h)"
        required: false
        default: "7200"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  soak:
    runs-on: ubuntu-latest
    # Weekly cron runs 5 h; nightly + manual default 2 h. Pick timeout to cover
    # the deep run plus build/clone/upload overhead.
    timeout-minutes: ${{ github.event.schedule == '0 4 * * 0' && 340 || 150 }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null; sudo apt-get update && sudo apt-get install -y sqlite3 git
      - name: Build refract
        run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: Fetch soak corpus (full Discourse + Mastodon)
        run: |
          mkdir -p /tmp/soak-workspace
          git clone --depth=1 https://github.com/discourse/discourse.git /tmp/soak-workspace/discourse
          git clone --depth=1 https://github.com/mastodon/mastodon.git /tmp/soak-workspace/mastodon
          # Prune VCS dirs to keep mutation-touch path counts manageable.
          rm -rf /tmp/soak-workspace/*/.git
          echo "soak corpus size:"
          du -sh /tmp/soak-workspace/* || true
          echo "ruby file count:"
          find /tmp/soak-workspace -name '*.rb' -type f | wc -l
      - name: Run soak harness
        env:
          REFRACT: ./zig-out/bin/refract
          # Weekly Sunday cron runs 5 h (18000 s); other schedules/manual: 2 h default.
          DURATION: ${{ github.event.inputs.duration_seconds || (github.event.schedule == '0 4 * * 0' && '18000' || '7200') }}
        run: scripts/soak.sh /tmp/soak-workspace "$DURATION"
      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: |
            /tmp/refract-soak-*/refract.stdout
            /tmp/refract-soak-*/refract.stderr
            ~/.local/state/refract/crash-*.log
          if-no-files-found: ignore
          retention-days: 14
