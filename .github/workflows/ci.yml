on:
  push:
    branches: ['**']         # all branches, no tags — tags are handled by release.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - run: zig fmt --check src/

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-cross-${{ hashFiles('build.zig.zon') }}
          restore-keys: linux-zig-cross-
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" -Dtarget=aarch64-linux-gnu
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" -Dtarget=x86_64-linux-musl
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" -Dtarget=aarch64-macos

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [lsp, mcp, edge]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-${{ matrix.suite }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: linux-zig-
      - run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null; sudo apt-get update && sudo apt-get install -y sqlite3
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" --release=safe
      - uses: actions/cache@v5
        with:
          path: /tmp/refract_test_stdlib_template.db
          key: linux-rbs-template-${{ hashFiles('src/indexer/**', 'src/main.zig') }}
          restore-keys: linux-rbs-template-
      - name: Warm stdlib RBS template
        run: |
          if [ ! -s /tmp/refract_test_stdlib_template.db ]; then
            ./zig-out/bin/refract --db-path /tmp/refract_test_stdlib_template.db --warm-stdlib
          fi
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" --release=safe test:${{ matrix.suite }}

  test-alpine:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: alpine:latest
    strategy:
      fail-fast: false
      matrix:
        suite: [lsp, mcp, edge]
    steps:
      - run: apk add --no-cache git curl xz sqlite tar ruby
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: alpine-zig-${{ matrix.suite }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: alpine-zig-
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - uses: actions/cache@v5
        with:
          path: /tmp/refract_test_stdlib_template.db
          key: alpine-rbs-template-${{ hashFiles('src/indexer/**', 'src/main.zig') }}
          restore-keys: alpine-rbs-template-
      - name: Warm stdlib RBS template
        run: |
          if [ ! -s /tmp/refract_test_stdlib_template.db ]; then
            ./zig-out/bin/refract --db-path /tmp/refract_test_stdlib_template.db --warm-stdlib
          fi
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)" test:${{ matrix.suite }}

  test-macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45      # types cell ~27min; guard against runner hangs
    strategy:
      fail-fast: false
      # Balanced into 5 cells (= free-plan macOS concurrency cap) so the lsp
      # suite runs in a single wave; wall-clock falls to the slowest cell.
      matrix:
        include:
          - name: types-cli-misc-edge
            steps: test:lsp-types test:lsp-cli test:lsp-misc test:edge
          - name: types2-rename
            steps: test:lsp-types2 test:lsp-rename
          - name: nav-completion-mcp
            steps: test:lsp-navigation test:lsp-completion test:mcp
          - name: robustness-indexing2
            steps: test:lsp-robustness test:lsp-indexing2
          - name: indexing-hover-life-editing-diag
            steps: test:lsp-indexing test:lsp-hover test:lsp-lifecycle test:lsp-editing test:lsp-diagnostics
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-aarch64-macos-0.16.0
          key: zig-bin-aarch64-macos-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-aarch64-macos-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: macos-zig-${{ matrix.name }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: macos-zig-
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - uses: actions/cache@v5
        with:
          path: /tmp/refract_test_stdlib_template.db
          key: macos-rbs-template-${{ hashFiles('src/indexer/**', 'src/main.zig') }}
          restore-keys: macos-rbs-template-
      - name: Warm stdlib RBS template
        run: |
          if [ ! -s /tmp/refract_test_stdlib_template.db ]; then
            ./zig-out/bin/refract --db-path /tmp/refract_test_stdlib_template.db --warm-stdlib
          fi
      # Run each test group in its own zig build, sequentially. A single
      # `zig build <g1> <g2> ...` executes the Run steps in parallel, and each
      # spawns many short-lived `refract` subprocess sessions at once; on a
      # contended runner that storm starves children past the harness watchdog
      # and truncates their stdout (NoSymbolResponse / Invalid-UTF-8 JSON
      # SyntaxError) — a cross-group flake. Serializing the groups removes the
      # subprocess storm. The compile cache persists across iterations, so only
      # the first call pays build cost.
      - run: |
          for g in ${{ matrix.steps }}; do
            zig build "-Dgit_sha=$(git rev-parse --short HEAD)" "$g" || exit 1
          done

  test-debug:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same 5-cell split as test-macos so the Debug suite parallelizes too.
      matrix:
        include:
          - name: types-cli-misc-edge
            steps: test:lsp-types test:lsp-cli test:lsp-misc test:edge
          - name: types2-rename
            steps: test:lsp-types2 test:lsp-rename
          - name: nav-completion-mcp
            steps: test:lsp-navigation test:lsp-completion test:mcp
          - name: robustness-indexing2
            steps: test:lsp-robustness test:lsp-indexing2
          - name: indexing-hover-life-editing-diag
            steps: test:lsp-indexing test:lsp-hover test:lsp-lifecycle test:lsp-editing test:lsp-diagnostics
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-debug-${{ matrix.name }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: linux-zig-debug-
      - run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null; sudo apt-get update && sudo apt-get install -y sqlite3
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - uses: actions/cache@v5
        with:
          path: /tmp/refract_test_stdlib_template.db
          key: linux-rbs-template-${{ hashFiles('src/indexer/**', 'src/main.zig') }}
          restore-keys: linux-rbs-template-
      - name: Warm stdlib RBS template
        run: |
          if [ ! -s /tmp/refract_test_stdlib_template.db ]; then
            ./zig-out/bin/refract --db-path /tmp/refract_test_stdlib_template.db --warm-stdlib
          fi
      # Run each test group in its own zig build, sequentially. A single
      # `zig build <g1> <g2> ...` executes the Run steps in parallel, and each
      # spawns many short-lived `refract` subprocess sessions at once; on a
      # contended runner that storm starves children past the harness watchdog
      # and truncates their stdout (NoSymbolResponse / Invalid-UTF-8 JSON
      # SyntaxError) — a cross-group flake. Serializing the groups removes the
      # subprocess storm. The compile cache persists across iterations, so only
      # the first call pays build cost.
      - run: |
          for g in ${{ matrix.steps }}; do
            zig build "-Dgit_sha=$(git rev-parse --short HEAD)" "$g" || exit 1
          done

  valgrind:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15      # self-test normally <1min; guard against runner hangs
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig binary
        id: zig-bin-cache
        uses: actions/cache@v5
        with:
          path: zig-x86_64-linux-0.16.0
          key: zig-bin-x86_64-linux-0.16.0
      - name: Download Zig
        if: steps.zig-bin-cache.outputs.cache-hit != 'true'
        run: curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz && tar -xJf zig.tar.xz && rm zig.tar.xz
      - run: echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: linux-zig-valgrind-${{ hashFiles('build.zig.zon') }}
          restore-keys: linux-zig-valgrind-
      - run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null; sudo apt-get update && sudo apt-get install -y valgrind sqlite3
      - run: zig build "-Dgit_sha=$(git rev-parse --short HEAD)"
      - name: valgrind --self-test (catches C-boundary leaks at SQLite/Prism)
        run: |
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --suppressions=/dev/null \
            ./zig-out/bin/refract --self-test
